<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rim)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Outer Optical Grid & Calibrations -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Outer Lens Ring with Metallic Chamfer -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#rim)" stroke-width="7" filter="url(#glow)"/>

  <!-- Aperture Blades (Camera / Optical Lens) -->
  <path d="M 256 120 L 340 180 L 310 230 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M 370 210 L 380 310 L 325 285 Z" fill="#1e293b" opacity="0.5"/>
  <path d="M 350 340 L 270 385 L 265 325 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M 220 375 L 145 320 L 195 285 Z" fill="#1e293b" opacity="0.5"/>
  <path d="M 140 280 L 140 180 L 200 215 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M 175 145 L 260 125 L 245 185 Z" fill="#1e293b" opacity="0.5"/>

  <!-- Inner Glass Convex Element -->
  <circle cx="256" cy="256" r="110" fill="url(#lensGlass)"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Optical Crosshairs -->
  <line x1="256" y1="126" x2="256" y2="152" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="256" y1="360" x2="256" y2="386" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="126" y1="256" x2="152" y2="256" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="256" x2="386" y2="256" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Cryptographic Shield & Keyhole Eye -->
  <g transform="translate(0, -4)" filter="url(#glow)">
    <!-- Protective Shield Contour -->
    <path d="M 256 180 Q 295 180 315 205 Q 315 255 256 295 Q 197 255 197 205 Q 217 180 256 180 Z" 
          fill="#090d16" stroke="url(#keyGrad)" stroke-width="4"/>
    
    <!-- Optical Sensor Pupil / Keyhole Core -->
    <circle cx="256" cy="226" r="18" fill="#38bdf8"/>
    <path d="M 250 232 L 246 258 L 266 258 L 262 232 Z" fill="#38bdf8"/>
    <circle cx="256" cy="226" r="8" fill="#090d16"/>
  </g>

  <!-- JWT 3-Color Beam Sparks (Header=Red, Payload=Violet, Signature=Cyan) -->
  <circle cx="190" cy="190" r="5" fill="#f43f5e" filter="url(#glow)"/>
  <circle cx="322" cy="190" r="5" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="256" cy="330" r="5" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Spectral Glare Arc -->
  <path d="M 180 180 A 100 100 0 0 1 290 162" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
</svg>
